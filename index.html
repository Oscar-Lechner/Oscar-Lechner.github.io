<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Oscar Lechner</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .gif-wrapper {
        width: 20vw;
        aspect-ratio: 1 / 1;
        margin-top: 10vh;
        margin-bottom: 5vh;
      }

      .gif-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .links {
        width: 20vw;
        min-width: 260px;
      }

      .links section {
        margin-bottom: 1.8rem;
      }

      .links section:last-child {
        margin-bottom: 0;
      }

      .links h2 {
        font-size: 0.75rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #888;
        margin: 0 0 0.6rem 0;
        padding-bottom: 0.6rem;
        border-bottom: 1px solid #ccc;
      }

      .center-link {
        display: block;
        text-align: left;
        margin: 0;
        padding: 0.45rem 0;
        font-size: 0.95rem;
        line-height: 1.4;
        letter-spacing: 0.01em;
        color: #222;
        text-decoration: none;
      }

      .center-link:hover {
        color: #000;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>

    <div class="gif-wrapper">
      <img src="FLOP.gif" alt="Looping GIF" />
    </div>

    <div class="links">
      <section>
        <h2>Portfolio</h2>
        <a href="https://oscarlechner.com/" class="center-link">oscarlechner.com</a>
      </section>

      <section>
        <h2>Class Work and Documentation</h2>
        <a href="https://oscar-lechner.github.io/object/progdoc.html" class="center-link">Object</a>
        <a href="https://oscar-lechner.github.io/dataforest" class="center-link">Capstone (Data Forest)</a>
        <a href="https://oscar-lechner.github.io/compfab/blog.html" class="center-link">Computational Fabrication</a>
        <a href="https://oscar-lechner.github.io/lifeofjoe/lifeofjoe.html" class="center-link">Life of Joe</a>
      </section>

      <section>
        <h2>Projects</h2>
        <a href="https://boulderalleycat.com" class="center-link">Boulder Alleycat</a>
        <a href="https://alleycat-tool.vercel.app" class="center-link">Alleycat Race Dashboard</a>
        
        <a href="https://gronchpad.vercel.app" class="center-link">gronchpad</a>
      </section>

      <section>
        <h2>Ultimate</h2>
        <a href="https://mamabird.com" class="center-link">Mamabird</a>
        <a href="https://mamabird.com/ckft" class="center-link">CKFT</a>
        <a href="https://quandaryultimate.me" class="center-link">Quandary</a>
      </section>
    </div>

  </body>
</html>
